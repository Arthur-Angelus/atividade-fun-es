<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo 01 - função</title>
</head>
<body>
    <script>
        //criando um exemplo de procedimento
        function exibirMensagem(){
            alert("urubu do flamengo");
        }

        function calcularSubtracao(){
            let num1 = parseInt(prompt("digite um valor: "));
            let num2 = parseInt(prompt("digite um valor: "));

            let total = num1 - num2;

            console.log("a subtração: " + total)
        }

        //criando uma função
        function calcularSoma(pikachu, bulbassauro){
            let v1 = pikachu;
            let v2 = bulbassauro;

            return v1 + v2
        }

        //utilizando o procedimento
       // exibirMensagem();
       calcularSubtracao();

       //chamando uma função com parametro
       console.log("a soma é: " + calcularSoma(5,5))
    </script>
</body>
</html>
