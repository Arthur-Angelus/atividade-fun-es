<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo 02 - função</title>
</head>
<body>
    <h1>Professor: <i id="professor"></i></h1>
    <span>Aula de <b id="aula"></b></span>
    <script>
        //inner -> interno
        //innerHTML
        document.getElementById('professor').innerHTML = "caio";
        document.getElementById('aula').innerHTML = "JavaScript";
    </script>
</body>
</html>
